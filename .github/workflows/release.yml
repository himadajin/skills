name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the workflow runs from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases must be run from main (got ${GITHUB_REF})."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.11"
          enable-cache: false

      - name: Test the validator
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Validate skills
        run: uv run --locked python scripts/validate_skills.py

      - name: Compute CalVer tag
        id: tag
        run: |
          git fetch --tags --quiet
          base="v$(TZ=Asia/Tokyo date +%Y.%m.%d)"
          tag="$base"
          n=0
          while git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null; do
            n=$((n + 1))
            tag="$base.$n"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing as $tag"

      - name: Build skill zips
        run: |
          mkdir -p dist
          for dir in skills/*/*/; do
            case "$dir" in skills/deprecated/*) continue ;; esac
            name="$(basename "$dir")"
            (cd "$(dirname "$dir")" && zip -r -q "../../dist/$name.zip" "$name" -x '*.DS_Store')
          done
          ls -l dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.tag.outputs.tag }}" \
            --generate-notes \
            dist/*.zip
