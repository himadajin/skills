<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>関数の解説</title>
<style>
:root{--bg:#FBFAF7;--fg:#1F2328;--mid:#59606a;--light:#8a9099;--rule:#DAD7D0;--faint:#EFECE6;--blue:#2F6FB3;--red:#B4443C;--tint:#EEF2F7;
--sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic","Meiryo",system-ui,-apple-system,"Segoe UI",sans-serif;
--mono:ui-monospace,"SFMono-Regular","Menlo","Consolas","DejaVu Sans Mono","Liberation Mono",monospace;}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--fg);font:15px/1.8 var(--sans);background:var(--bg);line-break:strict;word-break:normal;overflow-wrap:anywhere;font-feature-settings:"palt" 0}
main{max-width:1200px;margin:0 auto;padding:56px 48px 96px}
h1{font:600 30px/1.25 var(--mono);margin:0 0 8px}
h2{font-size:15px;font-weight:600;letter-spacing:.06em;color:var(--fg);margin:64px 0 16px;padding-bottom:8px;border-bottom:1px solid var(--fg)}
h3{font:600 17px/1.4 var(--mono);margin:0 0 4px}
h4{font-size:13px;color:var(--mid);font-weight:600;margin:0 0 10px}
p{margin:0 0 12px}
code,.mono{font-family:var(--mono);font-size:.92em;overflow-wrap:normal;word-break:keep-all}
a{color:var(--blue)}
.kicker{font-size:13px;color:var(--mid);margin:0 0 20px}
.lede{font-size:17px;max-width:40em;margin:0 0 28px}
dl.facts{display:grid;grid-template-columns:max-content 1fr;gap:4px 28px;margin:0;font-size:14px;max-width:760px}
dl.facts dt{color:var(--mid)}
dl.facts dd{margin:0}
.attn{color:var(--red)}
.todo{color:var(--light)}
.cols{display:grid;grid-template-columns:auto minmax(320px,1fr);gap:40px;align-items:start}
.cols.stacked{grid-template-columns:minmax(0,1fr)}
.cols.stacked .cfgwrap,.cfgwrap.tall{position:static;max-height:none}
.cols:has(.cfgwrap.tall) #detail{position:sticky;top:12px}
.cols.stacked #detail{max-width:44em}
.cfgwrap{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;min-width:0}
#cfg{display:block}
#cfg .node{cursor:pointer;outline:none}
#cfg .node rect.box{fill:var(--bg);stroke:var(--fg);stroke-width:1}
#cfg .node:hover rect.box{fill:#fff}
#cfg .node.sel rect.box{stroke:var(--blue);stroke-width:2.5}
#cfg .node.sel2 rect.box{stroke:var(--blue);stroke-width:1.5;stroke-dasharray:4 3}
#cfg .node:focus-visible rect.box{stroke-dasharray:3 2;stroke-width:2}
#cfg .nname{font:600 13px var(--mono);fill:var(--fg)}
#cfg .nidx{font:11px var(--mono);fill:var(--light)}
#cfg .node.sel .nname{fill:var(--blue)}
#cfg .nrule{stroke:var(--rule)}
#cfg .ni{font:12.5px var(--mono);fill:var(--fg);white-space:pre}
#cfg .nnote{font:12px var(--sans);fill:var(--mid)}
#cfg .ni .mn{font-weight:700}
#cfg .ni .tgt{fill:var(--blue);text-decoration:underline}
#cfg .ni .reg.hl{fill:var(--blue)}
#cfg .hlrow{fill:var(--tint)}
#cfg .edge{fill:none;stroke:var(--fg);stroke-width:1.2}
#cfg .edge.false{stroke-dasharray:5 4}
#cfg .edge.fallthrough{stroke:var(--light)}
#cfg .edge.back{stroke:var(--red);stroke-width:1.6}
#cfg .edge.default{stroke-dasharray:9 3 2 3}
#cfg .elab.case{fill:var(--fg);font:11.5px var(--mono)}
#cfg .elab.default{fill:var(--fg);font:italic 11.5px var(--sans)}
#cfg .elab-bg{fill:var(--bg);opacity:.9}
.cfgouter{position:relative;min-width:0}
.cfgouter .fade{position:absolute;top:0;bottom:0;width:36px;pointer-events:none;display:none;z-index:2}
.cfgouter .fade.r{right:0;background:linear-gradient(to right,rgba(251,250,247,0),rgba(140,140,140,.28))}
.cfgouter .fade.l{left:0;background:linear-gradient(to left,rgba(251,250,247,0),rgba(140,140,140,.28))}
.cfgouter.clipR .fade.r,.cfgouter.clipL .fade.l{display:block}
.scrollhint{display:none;font-size:12px;color:var(--mid);margin:0 0 4px}
.cfgouter.clipR .scrollhint,.cfgouter.clipL .scrollhint{display:block}
#cfg .elab{font:12px var(--sans);fill:var(--mid)}
#cfg .elab.back{fill:var(--red)}
.legend{font-size:12px;color:var(--mid);margin-top:10px;line-height:1.7}
.legend svg{vertical-align:middle;margin-right:4px}
.legend span{margin-right:16px;white-space:nowrap;display:inline-block}
#detail .meta{font-size:13px;color:var(--mid);margin-bottom:16px}
#detail .expl{max-width:38em;margin-top:18px}
table{border-collapse:collapse;width:100%}
.insn td{padding:5px 12px 5px 0;vertical-align:baseline;border-top:1px solid var(--faint)}
.insn tr:first-child td{border-top:0}
.insn tr{cursor:pointer}
.insn tr.srchl td{background:var(--tint)}
.insn td.ln{color:var(--light);font:12px var(--mono);width:2.5em;text-align:right}
.insn td.code{font-family:var(--mono);font-size:14px;white-space:pre}
.insn td.note{color:var(--mid);font-size:13.5px;width:45%}
.mn{font-weight:700}
.tgt{color:var(--blue);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;cursor:pointer}
.reg{cursor:pointer;border-bottom:1px dotted transparent}
.reg:hover{border-bottom-color:var(--light)}
.reg.hl{color:var(--blue);border-bottom-color:var(--blue)}
.reg:focus-visible,.tgt:focus-visible,.srow:focus-visible,.insn tr:focus-visible{outline:1px solid var(--blue);outline-offset:1px}
.regs th{text-align:left;white-space:nowrap;font-size:12px;font-weight:600;color:var(--mid);padding:6px 16px 6px 0;border-bottom:1px solid var(--rule)}
.regs td{padding:8px 16px 8px 0;border-bottom:1px solid var(--faint);vertical-align:baseline;font-size:14px}
.regs td.r{font-family:var(--mono);font-weight:600;width:6.5em}
.regs td.role{font-size:13px;width:10em;white-space:nowrap}
.role-1{color:var(--fg)}.role-2{color:var(--mid)}.role-3{color:var(--light)}
.role-u{color:var(--red);font-style:italic}
.regs td.loc{font-family:var(--mono);font-size:12.5px;color:var(--mid);white-space:nowrap}
.regs tr.hl td.r{color:var(--blue)}
.regs tr.hl td{background:#F2F5F9}
.notes{font-size:14px;color:var(--mid);max-width:44em;margin-top:14px}
.sub{font-size:13px;color:var(--mid);margin:-6px 0 14px;max-width:52em}
/* live ranges: vertical */
.lrwrap{overflow-x:auto;max-width:100%}
.lr{width:auto;border-collapse:separate;border-spacing:0}
.lr th,.lr td{padding:0}
.lr thead th{position:sticky;top:0;background:var(--bg);z-index:1;border-bottom:1px solid var(--fg);vertical-align:bottom}
.lr th.rh{width:30px;min-width:30px;font:12px var(--mono);font-weight:400;color:var(--fg);padding:6px 0;cursor:pointer}
.lr th.rh span{writing-mode:vertical-rl;display:inline-block;white-space:nowrap}
.lr th.rh.hl{color:var(--blue);font-weight:600}
.lr th.ch{text-align:left;font:600 12px var(--sans);color:var(--mid);padding:6px 24px 6px 0}
.lr td.n{font:11px var(--mono);color:var(--light);text-align:right;padding-right:10px;width:2.5em}
.lr td.c{font:13px var(--mono);white-space:pre;padding:0 24px 0 0;height:26px;vertical-align:middle}
.lr tr.ir{cursor:pointer}
.lr tr.ir.cur td.c,.lr tr.ir.cur td.n{background:var(--tint)}
.lr tr.ir.srchl td.c{box-shadow:inset 3px 0 0 var(--blue)}
.lr tr.bh td{font:600 12px var(--mono);color:var(--mid);padding:12px 0 2px;height:auto}
.lr tr.bh td.c{padding-top:12px}
.lr td.lv{position:relative;width:30px;min-width:30px}
.lr td.lv i{position:absolute;left:14px;width:2px;background:#A2A8B0}
.lr td.lv i.t{top:0;height:50%}.lr td.lv i.b{top:50%;bottom:0}.lr td.lv i.f{top:0;bottom:0}
.lr td.lv b{position:absolute;background:var(--fg)}
.lr td.lv b.d{left:11px;top:calc(50% - 4px);width:8px;height:8px}
.lr td.lv b.u{left:8px;top:calc(50% - 1px);width:14px;height:2px}
.lr td.lv.hl i,.lr td.lv.hl b{background:var(--blue)}
.lr td.lv.hl{background:#F2F5F9}
.lrkey{font-size:12px;color:var(--mid);margin-top:10px}
.listing{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px}
pre{font:13.5px/1.75 var(--mono);margin:0;white-space:pre;overflow-x:auto}
pre .lbl{display:block;margin-top:10px}
pre .lbl:first-child{margin-top:0}
pre .row{display:block;padding-left:2ch;cursor:pointer}
pre .row.cur{background:var(--tint)}
pre .row.srchl{box-shadow:inset 3px 0 0 var(--blue)}
pre .srow{display:block;cursor:pointer}
pre .srow:hover{background:#F4F2EE}
pre .srow.cur{background:var(--tint)}
pre .srow.pick{box-shadow:inset 3px 0 0 var(--blue)}
pre .srow.nomap{cursor:default}
pre .sln{color:var(--light);display:inline-block;width:3ch;text-align:right;margin-right:2ch}
footer{margin-top:72px;font-size:12px;color:var(--light);border-top:1px solid var(--rule);padding-top:12px}
@media (max-width:960px){.cols,.listing{grid-template-columns:1fr}.cfgwrap{position:static;max-height:none}main{padding:32px 20px}}
@media print{
 body{font-size:10.5pt}main{padding:0;max-width:none}.cols{grid-template-columns:1fr}.cfgwrap{position:static;max-height:none;overflow:visible}
 h2{break-after:avoid}.regs tr,.insn tr,.lr tr{break-inside:avoid}.lr thead th{position:static}
}
</style>
</head>

   </div>
  </div></div>
  <section id="detail" aria-live="polite"></section>
 </div>
 <h2 id="regs-title" lang="en">Registers</h2>
 <table class="regs" id="regs"></table>
 <div class="notes" id="notes"></div>
 <h2 lang="en">Live ranges</h2>
 <p class="sub">各列が 1 つの値。縦線は「その値が後でまだ使われる（生きている）」区間を示す。四角は書き込み、横線は読み出し。CFG から計算しているので、ループを回って使われる値はループ全体で生きている。</p>
 <div class="lrwrap"><table class="lr" id="live"></table></div>
 <h2 lang="en">Full listing</h2>
 <div class="listing"><div><h4 id="lst-title"></h4><pre id="listing"></pre></div><div id="srcwrap"></div></div>
 <footer id="foot"></footer>
</main>

  '　<span lang="en">To:</span> '+(b.successors.length?b.successors.map(function(s){return blink(s.target)+'<span'+(s.kind==='back'?' class="attn"':'')+' lang="en"> ('+esc(kindText(s))+')</span>'}).join(', '):'<span lang="en">returns</span>');
 if(lineBlocks&&lineBlocks.length>1)h+='<br>C の '+pickLine+' 行目に対応するブロック：'+lineBlocks.map(function(id){return blink(id)}).join('、');
 h+='</div><div class="expl">'+(b.explanation?prose(b.explanation):'<p class="todo">（explanation 未記入）</p>')+'</div>';document.getElementById('detail').innerHTML=h}
function marks(){ // which instructions / C lines are emphasised
 var hiG={},lines={};var L=pvLine||pickLine;
 if(L)(lineMap[L]||[]).forEach(function(x){hiG[x._g]=1});else if(pickG!=null)hiG[pickG]=1;
 if(L)lines[L]=1;else if(pickG!=null&&INS[pickG].source_line)lines[INS[pickG].source_line]=1;
 var blockLines={};if(cur)byId[cur].instructions.forEach(function(x){if(x.source_line)blockLines[x.source_line]=1});
 document.querySelectorAll('[data-g]').forEach(function(e){if(e.classList.contains('hlrow'))e.setAttribute('visibility',hiG[e.getAttribute('data-g')]?'visible':'hidden');else if(!e.classList.contains('lbl'))e.classList.toggle('srchl',!!hiG[e.getAttribute('data-g')])});
 document.querySelectorAll('.srow').forEach(function(r){var l=r.getAttribute('data-l');r.classList.toggle('cur',!!blockLines[l]&&!L&&pickG==null);r.classList.toggle('pick',!!lines[l])})}
function select(id,opt){opt=opt||{};var b=byId[id];if(!b)return;cur=id;pickLine=opt.line||null;pickG=opt.g!=null?opt.g:null;
 var lb=pickLine?uniq((lineMap[pickLine]||[]).map(function(x){return x._b.id})):null;
 document.querySelectorAll('#cfg .node').forEach(function(n){var bid=n.getAttribute('data-block');n.classList.toggle('sel',bid===id);n.classList.toggle('sel2',bid!==id&&!!lb&&lb.indexOf(bid)>=0);n.setAttribute('aria-pressed',bid===id)});
 renderDetail(b,lb);
 document.querySelectorAll('#listing .row, #live tr.ir').forEach(function(r){r.classList.toggle('cur',r.getAttribute('data-b')===id)});
 marks();applyHL();
 if(opt.scroll){var c=document.querySelector('.cols');if(c.getBoundingClientRect().top<0||c.getBoundingClientRect().top>innerHeight)c.scrollIntoView({behavior:'smooth',block:'start'})}
 var n=document.querySelector('#cfg .node.sel'),w=document.querySelector('.cfgwrap');if(n&&w.scrollHeight>w.clientHeight){var bb=n.getBBox(),ty=+n.getAttribute('transform').match(/,([\d.]+)/)[1];if(ty<w.scrollTop||ty+bb.height>w.scrollTop+w.clientHeight)w.scrollTop=ty-20}
 if(history.replaceState)history.replaceState(null,'','#'+id)}
function uniq(a){return a.filter(function(v,i){return a.indexOf(v)===i})}

// ---- register highlight (hover preview, click pin)
var pinned=null,hover=null;
function applyHL(){var r=hover||pinned;document.querySelectorAll('[data-reg]').forEach(function(e){e.classList.toggle('hl',!!(r&&e.getAttribute('data-reg')===r))})}
document.addEventListener('mouseover',function(e){var c=e.target.closest?e.target.closest('[data-reg]'):null;var v=c?c.getAttribute('data-reg'):null;if(v!==hover){hover=v;applyHL()}
 var s=e.target.closest?e.target.closest('.srow:not(.nomap)'):null;var l=s?+s.getAttribute('data-l'):null;if(l!==pvLine){pvLine=l;marks()}});
document.addEventListener('focusin',function(e){var c=e.target.closest&&e.target.closest('[data-reg]');hover=c?c.getAttribute('data-reg'):null;applyHL()});
function activate(e){var T=e.target.closest?e.target:e.target.parentNode;
 var r=T.closest('[data-reg]');if(r&&!r.closest('#live td.lv')){var v=r.getAttribute('data-reg');pinned=pinned===v?null:v;applyHL();e.preventDefault();return}
 var a=T.closest('a[data-block], #cfg .tgt');if(a){e.preventDefault();select(a.getAttribute('data-block'),{scroll:!a.closest('#cfg')});return}
 var s=T.closest('.srow');if(s&&!s.classList.contains('nomap')){var L=+s.getAttribute('data-l');var xs=lineMap[L];var bid=cur&&xs.some(function(x){return x._b.id===cur})?cur:xs[0]._b.id;select(bid,{line:L,scroll:true});return}
 var g=T.closest('[data-g]');if(g&&!g.classList.contains('hlrow')){var x=INS[+g.getAttribute('data-g')];select(x._b.id,{g:x._g});return}
 if(r){var v2=r.getAttribute('data-reg');pinned=pinned===v2?null:v2;applyHL();return}
 var n=T.closest('#cfg .node');if(n){select(n.getAttribute('data-block'));return}}
document.addEventListener('click',activate);
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('[data-block],[data-reg],.srow,[data-g]'))activate(e);
 if(e.key==='Escape'){pinned=null;hover=null;applyHL()}});
var h0=location.hash.slice(1);select(byId[h0]?h0:(B[0]&&B[0].id));
})();
</script>
</body>
</html>
